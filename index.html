<style>

.fieldLabel{display:block;font-size:13px;font-weight:900;letter-spacing:1px;margin:16px 0 8px}.input{width:100%;border:2px solid #d0dece;border-radius:12px;padding:14px 14px;background:#fff;color:#14372c;outline:0;font-weight:700}.input:focus{border-color:#83bca1;box-shadow:0 0 0 3px #83bca138}.input::placeholder{color:#a2b3a7}.primary{width:100%;margin-top:23px;background:#335e43;color:white;border:0;border-bottom:5px solid #23422f;padding:15px;border-radius:13px;font-weight:1000;font-size:18px;transition:transform .1s}.primary:active{transform:translateY(3px);border-bottom-width:2px}.errmsg{min-height:22px;font-size:13px;color:#bb5656;margin:12px 0 0;font-weight:800}.tiny{margin-top:12px;text-align:center;color:#819184;font-size:12px;font-weight:700}

.stageBar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f5f4e9;padding:13px 17px;border-radius:14px;min-height:70px}.stageBar .badge{display:inline-block;background:#b4ddbd;color:#275940;border-radius:8px;font-size:11px;padding:5px 8px;font-weight:1000;letter-spacing:1px}.stageBar h2{margin:4px 0 0;font-size:20px;letter-spacing:-.5px}.stageBar p{margin:3px 0 0;color:#6c8170;font-size:13px;font-weight:750}.gameStats{font-size:12px;text-align:right;color:#7d8b7f;font-weight:800;white-space:nowrap}.gameStats b{font-size:17px;color:#335e43}

.chatPanel{height:min(calc(100dvh - 125px),790px);min-height:490px;background:#f9f8f0;border-radius:17px;display:flex;flex-direction:column;box-shadow:0 5px 0 #0a1d17;overflow:hidden}.chatTop{display:flex;align-items:center;justify-content:space-between;padding:18px 17px 13px;border-bottom:2px solid #e5eadf}.chatTop strong{font-size:19px}.chatTop small{font-size:12px;font-weight:900;color:#7d9b86}.chatLog{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow-y:auto;padding:15px 15px 19px;overscroll-behavior:contain}.message{max-width:94%;word-break:break-word}.message.me{align-self:flex-end}.message .who{font-size:11px;font-weight:900;color:#839387;margin-bottom:5px}.message.me .who{text-align:right}.bubble{background:#e8eee5;border-radius:5px 15px 15px 15px;padding:10px 13px;line-height:1.5;font-size:13px;font-weight:690;color:#2d5140;white-space:pre-wrap}.message.me .bubble{background:#c5e5c4;border-radius:15px 5px 15px 15px}.systemMessage{align-self:center;background:#eef0e7;border-radius:9px;padding:7px 11px;color:#8b9a89;text-align:center;font-size:11px;font-weight:800;line-height:1.5;max-width:95%}
.chatInputBar{display:flex;gap:7px;padding:12px;border-top:2px solid #ebeee5;background:#fbfcf6}.chatInputBar input{flex:1;min-width:0;outline:0;padding:11px 12px;border-radius:10px;border:2px solid #dfe9dc;background:#fff;color:#244934;font-size:13px}.chatInputBar input:focus{border-color:#8ab99a}.send{border:0;border-radius:10px;background:#37674a;color:white;font-size:15px;font-weight:900;padding:0 13px}.chatInfo{text-align:center;font-size:11px;color:#8c9a8c;font-weight:700;padding:0 7px 11px;background:#fbfcf6}
#chatToggle,#joystick,#mobileEmote,#mobileChat{display:none}#chatToggle{position:relative}.unread{position:absolute;right:-3px;top:-5px;background:#ef856e;color:white;border-radius:100px;font-size:10px;padding:1px 5px;min-width:18px}

#joystick{position:absolute;left:24px;bottom:22px;width:112px;height:112px;border-radius:50%;background:#284b4777;border:3px solid #ffffff77;z-index:3;touch-action:none}#stick{position:absolute;left:31px;top:31px;width:44px;height:44px;border-radius:50%;background:#f4f1ddcc;border:3px solid #fff8;box-shadow:0 3px 6px #1b24242c;pointer-events:none}#mobileEmote,#mobileChat{position:absolute;z-index:3;bottom:29px;width:60px;height:60px;border:3px solid #fffd;border-radius:50%;background:#355c47d9;color:white;font-size:23px;font-weight:1000;box-shadow:0 4px 10px #18382040}#mobileEmote{right:18px}#mobileChat{right:89px}
@media(max-width:1000px){.gameLayout{grid-template-columns:minmax(0,1fr) 278px}.topLogo strong{font-size:17px}.topbar{padding:11px 13px}.chip{padding:7px}}
@media(max-width:740px){#game{padding:8px;gap:8px}.topbar{min-height:62px;border-radius:12px;gap:7px;padding:9px}.topLogo small{display:none}.topLogo .disc{height:30px;width:30px;font-size:20px}.topLogo strong{font-size:16px}.roomStrip{gap:5px}.chip{padding:6px;font-size:10px;border-width:1px}.chip b{font-size:13px}.smallBtn{padding:8px;font-size:11px}.roomStrip #resetBtn{display:none}.gameLayout{display:block}.stageBar{padding:10px 12px;min-height:58px}.stageBar h2{font-size:17px}.stageBar p{font-size:11px}.gameStats{font-size:11px}.gameStats b{font-size:15px}.canvasBox{border-width:3px;border-radius:13px}.hint{padding:11px;font-size:12px}.chatPanel{display:none;position:fixed;z-index:10;left:8px;right:8px;top:16%;height:70dvh;min-height:0;border:3px solid #fff;box-shadow:0 0 0 200vmax #071912a8,0 15px 40px #0009}.chatPanel.open{display:flex}#chatToggle{display:block}.menuCard{padding:27px 22px}.brandLogo{font-size:35px}.bigKiwi{transform:scale(.85)}#joystick,#mobileEmote,#mobileChat{display:block}#mobileChat{display:none}.canvasBox{min-height:0}.canvasBox #joystick{width:96px;height:96px;left:12px;bottom:10px}#stick{left:25px;top:25px;width:40px;height:40px}#mobileEmote{right:13px;bottom:11px;width:53px;height:53px;font-size:19px}.chatTop{padding:13px 15px}.chatTop button{display:block!important}}
@media(hover:none) and (pointer:coarse){#joystick,#mobileEmote{display:block}}
@media(max-width:440px){.menuCard{border-width:3px}.brandHead{gap:2px}.brandLogo{font-size:30px}.brandSub{letter-spacing:1.8px}.topLogo .disc{display:none}.topLogo strong{font-size:14px}.roomStrip #leaveBtn{display:none}.stageBar p{max-width:260px}.hint{align-items:flex-start}.hint .right{display:none}}

/* Full-viewport game layout */
html,body{height:100%;overflow-x:hidden}
#game{width:100%;max-width:none;height:100dvh;min-height:0;margin:0;padding:8px;gap:7px;overflow:hidden}
.topbar{min-height:52px;flex-shrink:0;padding:7px 13px;border-radius:7px}
.gameLayout{flex:1;min-height:0;align-items:stretch;grid-template-columns:minmax(0,1fr) minmax(240px,290px);gap:8px}
.playColumn{min-height:0;gap:7px}
.stageBar{min-height:54px;flex-shrink:0;padding:7px 13px;border-radius:7px}
.canvasBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:0;background:#b9d4b0;box-shadow:none}
#board{width:100%;height:100%;aspect-ratio:auto;object-fit:contain}
.hint{flex-shrink:0;padding:7px 10px;border-radius:4px}
.chatPanel{height:100%;min-height:0;border-radius:7px}
@media(max-width:740px){#game{padding:0;gap:0}.topbar{min-height:48px;border-radius:0}.gameLayout{display:flex;flex-direction:column;min-height:0;gap:0}.playColumn{flex:1;min-height:0;gap:0}.stageBar{min-height:51px;border-radius:0}.canvasBox{flex:1;min-height:0;border:0;border-radius:0}.hint{font-size:10px;border-radius:0;padding:6px 9px}.chatPanel{position:fixed;top:10%;bottom:4%;left:3%;right:3%;height:auto;min-height:0;z-index:10}.chatPanel:not(.open){display:none}}

/* Landscape single-screen interface */
#game{position:fixed;inset:0;width:100%;height:100dvh;max-width:none;padding:0;gap:0;overflow:hidden;background:#b9d4b0}
.gameLayout,.playColumn{display:block;position:absolute;inset:0;width:100%;height:100%;min-height:0}
.canvasBox{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
#board{width:100%;height:100%;object-fit:fill}
.topbar{position:absolute;z-index:7;left:8px;right:8px;top:6px;width:auto;min-height:0;height:37px;padding:3px 8px;border-radius:7px;background:#f6f3e9cf;box-shadow:none;gap:4px}
.topLogo .disc,.topLogo small{display:none!important}.topLogo strong{font-size:12px!important;letter-spacing:0}
.roomStrip{gap:4px;flex-wrap:nowrap}.chip{padding:4px 6px;font-size:10px;border:0;background:#ffffffb5}.chip b{font-size:11px}
.smallBtn{padding:5px 8px;font-size:11px;border:0;border-radius:6px;background:#d9e9d7d9}
#chatToggle{display:block!important}#resetBtn,#leaveBtn{display:none!important}
.stageBar{position:absolute;z-index:5;top:47px;left:8px;right:auto;max-width:65%;min-height:0;padding:5px 8px;background:#f7f5e9b8;border-radius:6px;pointer-events:none}
.stageBar .badge{font-size:9px;padding:2px 4px}.stageBar h2{font-size:12px;margin:1px 0}.stageBar p{display:none}.gameStats{font-size:9px;margin-left:10px}.gameStats b{font-size:11px}
.hint{position:absolute;z-index:5;right:8px;bottom:5px;padding:4px 7px;font-size:9px!important;font-weight:500;background:#172d2780;color:#fff9;border-radius:5px;pointer-events:none}.hint b{color:inherit}.hint .right{display:none}
.chatPanel,.chatPanel.open{position:absolute;z-index:11;top:45px;right:8px;left:auto;bottom:8px;width:min(300px,47vw);height:auto;min-height:0;border:1px solid #dce6d3;border-radius:8px;box-shadow:0 5px 25px #0007;background:#f9f8f0ed}
.chatPanel:not(.open){display:none}.chatTop{padding:6px 9px}.chatTop strong{font-size:13px}.chatTop small{display:none}.chatTop button{display:block!important}.chatLog{padding:7px;gap:5px}.chatInputBar{padding:6px}.chatInputBar input{padding:7px;font-size:12px}.send{font-size:12px}
#joystick{display:block;left:15px;bottom:15px;width:86px;height:86px;background:#284b4750;border:2px solid #ffffff60}
#stick{left:23px;top:23px;width:36px;height:36px}

#mobileChat{display:none!important}
#reconnect{top:auto;bottom:6px;left:50%;padding:5px 9px;font-size:11px;z-index:12;white-space:nowrap}#reconnect button{padding:4px 7px}

 #game{inset:auto;left:100vw;top:0;width:100dvh;height:100vw;transform-origin:top left;transform:rotate(90deg)}
 .topbar{height:34px}.stageBar{top:43px}

<body>
<div id="stars"></div>
<section id="menu">
  <div class="menuCard">
    <div class="brandHead">
      <div class="bigKiwi" aria-hidden="true"><div class="body"></div><div class="eye left"></div><div class="eye right"></div><div class="beak"></div><div class="foot a"></div><div class="foot b"></div></div>
      <div><div class="brandLogo">KIWI <span>TOGETHER</span></div><div class="brandSub">CO-OP ESCAPE CLUB</div></div>
    </div>
    <p class="blurb">2D 온라인 협동 퍼즐 게임</p>
    <div class="segment"><button type="button" id="createTab" class="active">✦ 새 방 만들기</button><button type="button" id="joinTab">➜ 친구 방 참여</button></div>
    <form id="startForm" autocomplete="off">
      <label class="fieldLabel" for="nameInput">플레이어 이름</label>
      <input class="input" id="nameInput" placeholder="예: 동글키위" maxlength="14" required>
      <div id="roomField" class="hidden"><label class="fieldLabel" for="roomInput">초대받은 방 코드</label><input class="input" id="roomInput" placeholder="5글자 코드" maxlength="5" autocapitalize="characters" spellcheck="false"></div>
      <button type="submit" class="primary" id="startBtn">방 만들고 입장하기 →</button>
      <p id="errorText" class="errmsg"></p>
    </form>
    <div class="tiny">최대 4명 · PC/모바일 · 실시간 채팅</div>
  </div>
</section>
<section id="game" class="hidden">
  <header class="topbar">
    <div class="topLogo"><span class="disc">🥝</span><div><strong>KIWI TOGETHER</strong><small>ESCAPE WITH FRIENDS</small></div></div>
    <div class="roomStrip">
      <span class="chip">ROOM <b id="roomCode">-----</b></span>
      <button class="smallBtn" id="copyBtn">초대</button>
      <button class="smallBtn" id="chatToggle">채팅 <span id="unread" class="unread hidden">0</span></button>
      <button class="smallBtn" id="resetBtn">↻ 초기화</button>
      <button class="smallBtn" id="leaveBtn">나가기</button>
    </div>
  </header>
  <div class="gameLayout">
    <main class="playColumn">
      <div class="stageBar"><div><span class="badge" id="stageTag">ROOM 01 / 03</span><h2 id="stageTitle">동시 발판</h2><p id="stageDesc">서로 다른 발판을 동시에 밟아 문을 여세요.</p></div><div class="gameStats">참가 인원<br><b id="playerCount">1 / 4</b><br><span id="timer">00:00</span></div></div>
      <div class="canvasBox" id="canvasBox">
        <canvas id="board" width="960" height="540" aria-label="키위 협동 방탈출 게임 화면"></canvas>
        <div id="toast" role="status"></div>
        <div id="winPanel" class="hidden"><div class="trophy">🏆</div><h2>WE DID IT!</h2><p>3개의 퍼즐을 완료했습니다.</p><button id="replayBtn">처음부터 다시 하기</button></div>
        <div id="joystick"><div id="stick"></div></div>
        <button id="mobileEmote" title="삐약!" aria-label="삐약 말풍선">♪</button>
        <button id="mobileChat" aria-label="채팅 열기">💬</button>
      </div>
      <div class="hint"><span>WASD / 방향키 · Enter: 채팅 · Space: 액션</span></div>
    </main>
    <aside class="chatPanel" id="chatPanel" aria-label="실시간 채팅">
      <div class="chatTop"><div><strong>💬 키위 채팅</strong><br><small>실시간 메시지</small></div><button class="smallBtn hidden" id="chatClose">닫기</button></div>
      <div class="chatLog" id="chatLog" aria-live="polite"></div>
      <form class="chatInputBar" id="chatForm"><input id="chatInput" maxlength="120" placeholder="메시지 입력" autocomplete="off"><button type="submit" class="send">전송</button></form>
      
    </aside>
  </div>
</section>
<div id="reconnect" class="hidden">연결 종료 <button id="retryBtn">재접속</button></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('board'),ctx=canvas.getContext('2d');
let socket=null,myId='',roomCode='',playerName='',joinMode=false,joined=false;
let localVisual=null,visualTime=0;let state=null,keys=new Set(),joyX=0,joyY=0,joyPointer=null,toastTimer=0,unread=0,lastInput='',lastChatBubbles=new Map();
const params=new URLSearchParams(window.location.search);
if(params.has('room')){joinMode=true;$('roomInput').value=(params.get('room')||'').toUpperCase().slice(0,5);}
try{$('nameInput').value=localStorage.getItem('kiwi_name')||'';}catch(e){}
function setMode(join){joinMode=join;$('createTab').classList.toggle('active',!join);$('joinTab').classList.toggle('active',join);$('roomField').classList.toggle('hidden',!join);$('startBtn').textContent=join?'친구 방 들어가기 →':'방 만들고 입장하기 →';$('errorText').textContent='';}
$('createTab').addEventListener('click',()=>setMode(false));$('joinTab').addEventListener('click',()=>setMode(true));setMode(joinMode);
function message(type,data){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(Object.assign({type},data||{})));}
function startConnection(retry){
  if(socket){try{socket.close();}catch(e){}}
  $('errorText').textContent='';$('startBtn').disabled=true;$('startBtn').textContent='연결 중...';
  const wsProtocol=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(wsProtocol+'//'+location.host);socket=ws;
  ws.addEventListener('open',()=>{message('join',{name:playerName,room:joinMode?roomCode:''});});
  ws.addEventListener('message',ev=>{
    let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.type==='welcome'){
      myId=m.id;roomCode=m.room;joined=true;localVisual={x:142,y:247};visualTime=performance.now();
      $('menu').classList.add('hidden');$('game').classList.remove('hidden');$('reconnect').classList.add('hidden');$('startBtn').disabled=false;
      $('roomCode').textContent=roomCode;
      try{history.replaceState(null,'',location.pathname+'?room='+roomCode);}catch(e){}
      addSystem('ROOM '+roomCode);
    }else if(m.type==='state'){
      state=m;
      const own=(m.players||[]).find(p=>String(p.id)===String(myId));
      if(own){
        if(!localVisual)localVisual={x:Number(own.x),y:Number(own.y)};
        else{
          const error=Math.hypot(localVisual.x-own.x,localVisual.y-own.y);
          if(error>90)localVisual={x:Number(own.x),y:Number(own.y)};
          else{localVisual.x+=(own.x-localVisual.x)*.38;localVisual.y+=(own.y-localVisual.y)*.38;}
        }
      }
      renderHUD(m);
    }
    else if(m.type==='chat'){addChat(m);lastChatBubbles.set(m.id,{text:m.text,time:Date.now()});}
    else if(m.type==='notice'){addSystem(m.text);showToast(m.text);}
    else if(m.type==='bubble'){lastChatBubbles.set(m.id,{text:m.text,time:Date.now()});}
    else if(m.type==='error'){
      $('errorText').textContent=m.text;showToast(m.text);$('startBtn').disabled=false;$('startBtn').textContent=joinMode?'친구 방 들어가기 →':'방 만들고 입장하기 →';
      if(!joined){ws.close();}
    }
  });
  ws.addEventListener('close',()=>{
    if(socket!==ws)return;
    $('startBtn').disabled=false;$('startBtn').textContent=joinMode?'친구 방 들어가기 →':'방 만들고 입장하기 →';
    if(joined){$('reconnect').classList.remove('hidden');joined=false;}
    else if(!$('errorText').textContent)$('errorText').textContent='서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.';
  });
  ws.addEventListener('error',()=>{if(!joined)$('errorText').textContent='연결에 실패했습니다. 서버 주소를 확인하세요.';});
}

  if(joinMode&&roomCode.length!==5){$('errorText').textContent='방 코드를 5글자 입력하세요.';return;}

  const variant=Math.floor(s.stage/3)+1;
  $('stageTag').textContent=complete?'COMPLETE':`STAGE ${String(s.stage+1).padStart(2,'0')} / 30`;
  $('stageTitle').textContent=complete?'ALL CLEAR':names[s.stage%3]+` ${variant}`;
  $('stageDesc').textContent='';

const movementKeys={'w':'up','arrowup':'up','s':'down','arrowdown':'down','a':'left','arrowleft':'left','d':'right','arrowright':'right'};
window.addEventListener('keydown',e=>{
  if(!joined)return;
  const target=e.target;
  if(target&&(['INPUT','TEXTAREA'].includes(target.tagName)||target.isContentEditable)){
    if(e.key==='Escape'){target.blur();toggleChat(false);}return;
  }
  const k=e.key.toLowerCase();
  if(movementKeys[k]){keys.add(movementKeys[k]);e.preventDefault();}
  else if(e.key==='Enter'){e.preventDefault();if(innerWidth<=740)toggleChat(true);else $('chatInput').focus();}
  else if(e.code==='Space'||k==='e'){e.preventDefault();if(!e.repeat)message('emote',{index:0});}
  else if(['1','2','3','4'].includes(k)&&!e.repeat)message('emote',{index:Number(k)-1});
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(movementKeys[k])keys.delete(movementKeys[k]);});
window.addEventListener('blur',()=>{keys.clear();joyX=0;joyY=0;updateStick();});
const joy=$('joystick'),stick=$('stick');
function updateStick(){const width=joy.clientWidth;const size=stick.clientWidth;const range=(width-size)/2-4;stick.style.left=((width-size)/2+joyX*range)+'px';stick.style.top=((width-size)/2+joyY*range)+'px';}
function joyPoint(e){
  // Derive direction from the joystick's actual transformed axes.
  const b=joy.getBoundingClientRect();
  const centerX=b.left+b.width/2, centerY=b.top+b.height/2;
  const rotated=window.matchMedia('(orientation:portrait) and (max-width:900px)').matches;
  let dx=e.clientX-centerX,dy=e.clientY-centerY;
  if(rotated){const oldX=dx;dx=dy;dy=-oldX;}
  const radius=Math.max(20,joy.offsetWidth*.36);
  const len=Math.hypot(dx,dy);
  const power=Math.min(1,len/radius);
  joyX=len>3?dx/len*power:0;joyY=len>3?dy/len*power:0;
  updateStick();
}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;try{joy.setPointerCapture(e.pointerId);}catch(_){}joyPoint(e);});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer){e.preventDefault();joyPoint(e);}});
function joyEnd(e){if(e.pointerId===joyPointer){joyPointer=null;joyX=0;joyY=0;updateStick();}}
window.addEventListener('pointerup',joyEnd);window.addEventListener('pointercancel',joyEnd);
let moveCount=0;
setInterval(()=>{
 if(!joined)return;
 const dx=Number(keys.has('right'))-Number(keys.has('left'))+joyX;
 const dy=Number(keys.has('down'))-Number(keys.has('up'))+joyY;
 const len=Math.max(1,Math.hypot(dx,dy));
 const mx=Math.round(dx/len*100)/100,my=Math.round(dy/len*100)/100;
 const now=mx+','+my;
 if(now!==lastInput||moveCount++%7===0){message('move',{x:mx,y:my});lastInput=now;}
},55);

function roundRect(x,y,w,h,r,fill,stroke,lw=1){
  ctx.beginPath();if(typeof ctx.roundRect==='function')ctx.roundRect(x,y,w,h,r);else{ctx.rect(x,y,w,h);}if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}

function text(str,x,y,size,color='#274c3b',align='center',weight=900){ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=weight+' '+size+'px system-ui, sans-serif';ctx.fillText(str,x,y);}
function drawFlower(x,y,c='#f4fbdd',scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);for(let i=0;i<5;i++){ctx.rotate(Math.PI*2/5);ctx.beginPath();ctx.ellipse(0,-6,3,6,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();}ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fillStyle='#eece74';ctx.fill();ctx.restore();}
function floor(){
  ctx.fillStyle='#c9debe';ctx.fillRect(0,0,960,540);
  for(let iy=0;iy<12;iy++)for(let ix=0;ix<21;ix++){
    let x=ix*48,y=iy*48;
    ctx.fillStyle=(ix+iy)%2?'#dceacb':'#d3e4c5';ctx.fillRect(x,y,48,48);
    if((ix*7+iy*11)%9===0){ctx.strokeStyle='#bad2ad';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+17,y+30);ctx.lineTo(x+19,y+20);ctx.moveTo(x+19,y+26);ctx.lineTo(x+25,y+23);ctx.stroke();}
  }
  for(let i=0;i<16;i++){
    const x=65+(i*139)%820,y=83+(i*187)%365;
    if(i%2===0)drawFlower(x,y,'#f8f5dc',.6);else drawFlower(x,y,'#ecf4b6',.55);
  }
  ctx.fillStyle='#a1be9e';ctx.fillRect(0,0,960,51);ctx.fillRect(0,487,960,53);ctx.fillRect(0,0,50,540);ctx.fillRect(908,0,52,540);

  roundRect(56,67,848,411,18,null,'#88b09a',3);
}
function wall(w){
  roundRect(w.x+4,w.y+5,w.w,w.h,5,'#6b827b');
  roundRect(w.x,w.y,w.w,w.h,5,'#779c8e','#4d786d',2);

  ctx.strokeStyle='#aec4af';ctx.lineWidth=1.5;
  for(let y=w.y+28;y<w.y+w.h-8;y+=36){ctx.beginPath();ctx.moveTo(w.x+3,y);ctx.lineTo(w.x+w.w-3,y);ctx.stroke();}
}
function pad(x,y,on,label){
  ctx.beginPath();ctx.ellipse(x,y+6,43,30,0,0,Math.PI*2);ctx.fillStyle='#667e69a8';ctx.fill();
  ctx.beginPath();ctx.ellipse(x,y,41,29,0,0,Math.PI*2);ctx.fillStyle=on?'#baf19a':'#eef3c7';ctx.fill();ctx.strokeStyle=on?'#4d9b65':'#84a686';ctx.lineWidth=5;ctx.stroke();
  ctx.beginPath();ctx.ellipse(x,y,27,18,0,0,Math.PI*2);ctx.fillStyle=on?'#78cc78':'#c1d3a5';ctx.fill();
  text(label,x,y+2,13,on?'#31583a':'#648367');
  if(on){ctx.strokeStyle='#f9ffd2';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,49,0,Math.PI*2);ctx.stroke();}

function drawGate(x,y,h,open){

    ctx.fillStyle='#b1f5c044';ctx.fillRect(x,y,20,h);
    for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(x+11,y+20+i*27,3.5,0,Math.PI*2);ctx.fillStyle='#eefbaf';ctx.fill();}
  }else{

    for(let i=0;i<4;i++)roundRect(x-2,y+8+i*28,26,7,2,'#edb598','#855b56',1);

function crate(x,y){

  ctx.lineWidth=5;ctx.strokeStyle='#ae8759';ctx.beginPath();ctx.moveTo(-17,-17);ctx.lineTo(17,17);ctx.moveTo(17,-17);ctx.lineTo(-17,17);ctx.stroke();
  ctx.fillStyle='#fff2ba';for(let a of [[-19,-19],[19,-19],[-19,19],[19,19]]){ctx.beginPath();ctx.arc(a[0],a[1],2.5,0,Math.PI*2);ctx.fill();}

function kiwi(p,elapsed){
  const x=Number(p.x)||142,y=Number(p.y)||247;const moving=p.id===myId?keys.size>0||Math.hypot(joyX,joyY)>.1:true;
  const bob=Math.sin(elapsed/165+Number(p.x)/50)*1.7;
  ctx.save();ctx.translate(x,y+bob);
  ctx.beginPath();ctx.ellipse(0,18,26,8,0,0,Math.PI*2);ctx.fillStyle='#476b524f';ctx.fill();
  // Feet
  roundRect(-17,17,15,9,4,'#ab7952');roundRect(3,17,15,9,4,'#ab7952');
  // Round, fluffy kiwi bird
  const grad=ctx.createRadialGradient(-9,-12,2,2,1,31);grad.addColorStop(0,'#f8e8ce');grad.addColorStop(.45,/^#[0-9a-fA-F]{3,8}$/.test(p.color||'')?p.color:'#d4b488');grad.addColorStop(1,'#987955');
  ctx.beginPath();ctx.ellipse(0,-1,28,29,-.12,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.strokeStyle='#735c47';ctx.lineWidth=2.5;ctx.stroke();
  ctx.beginPath();ctx.ellipse(-17,3,8,12,-.4,0,Math.PI*2);ctx.fillStyle='#b9946c';ctx.fill();
  // Face
  ctx.fillStyle='#292c27';for(const a of [-9,10]){ctx.beginPath();ctx.ellipse(a,-7,3.8,5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(a-1,-9,1.3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle='#292c27';}
  ctx.beginPath();ctx.moveTo(-1,-1);ctx.lineTo(19,3);ctx.lineTo(-1,7);ctx.closePath();ctx.fillStyle='#e9ab5f';ctx.fill();ctx.strokeStyle='#bf7f47';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
  // Player name: above head
  ctx.font='850 13px system-ui,sans-serif';const label=p.name||'키위';const labelW=Math.min(190,ctx.measureText(label).width+23);
  roundRect(x-labelW/2,y-59,labelW,23,9,p.id===myId?'#244e3e':'#f8f6e9','#ffffff9c',1);
  text(label,x,y-47,12,p.id===myId?'#fff':'#3d5d47');
  if(p.id===myId){ctx.beginPath();ctx.moveTo(x-6,y-36);ctx.lineTo(x+6,y-36);ctx.lineTo(x,y-30);ctx.closePath();ctx.fillStyle='#244e3e';ctx.fill();}
  const bubble=lastChatBubbles.get(p.id);
  if(bubble&&Date.now()-bubble.time<3000){
    const value=bubble.text.length>20?bubble.text.slice(0,20)+'…':bubble.text;
    ctx.font='800 14px system-ui';const width=Math.min(260,Math.max(72,ctx.measureText(value).width+24));
    roundRect(x-width/2,y-100,width,30,10,'#fffef2','#95ba9d',2);text(value,x,y-84,13,'#3d6447');
  }
}
function drawScene(t){
  requestAnimationFrame(drawScene);
  if(!joined)return;
  const elapsedSec=Math.min(.05,Math.max(0,(t-visualTime)/1000));visualTime=t;
  if(localVisual){
    const vx=Number(keys.has('right'))-Number(keys.has('left'))+joyX;
    const vy=Number(keys.has('down'))-Number(keys.has('up'))+joyY;
    const length=Math.max(1,Math.hypot(vx,vy));
    localVisual.x=Math.max(55,Math.min(900,localVisual.x+vx/length*185*elapsedSec));
    localVisual.y=Math.max(60,Math.min(490,localVisual.y+vy/length*185*elapsedSec));
  }
  if(!state){ctx.fillStyle='#d3e4c5';ctx.fillRect(0,0,960,540);kiwi({id:myId,x:localVisual?.x??142,y:localVisual?.y??247,name:playerName,color:'#d4b488'},t);return;}
  try{ctx.clearRect(0,0,960,540);floor();
  const s=state;
  // ground art/landmarks
  roundRect(71,243,110,73,20,'#eaf0c9bb');
  text('START',124,279,16,'#86a28c');
  if(s.stage>=30){
    text('ALL CLEAR',480,260,44,'#38664a');

    pad(285,176,s.plateA,'①');pad(285,390,s.plateB,'②');

    if(s.latch){ctx.fillStyle='#a0d19d88';roundRect(580,164,165,228,28,'#d5edbd55');}
  }else if(s.stage%3===1){
    wall({x:485,y:65,w:24,h:149});wall({x:485,y:340,w:24,h:148});
    const doorOpen=s.stage2Plate||s.keyTaken;
    drawGate(485,214,126,doorOpen);

    if(!s.keyTaken){keyShape(708,274);text('황금 열쇠',706,219,18,'#8f773b');}
    else {const owner=(s.players||[]).find(p=>p.id===s.keyOwner);if(owner)keyShape(owner.x+23,owner.y-23);}
    text(doorOpen?'문이 열렸어!':'버튼을 밟자!',340,85,20,doorOpen?'#58986c':'#78956e');
  }else if(s.stage%3===2){
    wall({x:483,y:243,w:142,h:54});
    for(let i=0;i<2;i++){
      pad(674,i===0?189:381,(s.targets||[])[i],'BOX');
    }
    for(const b of (s.boxes||[]))crate(b.x,b.y);
    text(s.latch?'둘 다 성공!':'상자를 밀어줘!',603,91,21,s.latch?'#579666':'#78966b');
  }else if(s.stage>=30){
    for(let i=0;i<18;i++){ctx.fillStyle=['#ffcf85','#d4efca','#f2aac1','#d9d4f5'][i%4];ctx.save();ctx.translate(90+(i*73)%777,120+(i*113)%320);ctx.rotate(t/1000+i);ctx.fillRect(-5,-3,10,6);ctx.restore();}
  }
  if(s.stage<30){wall(EXIT_TOP);wall(EXIT_BOTTOM);if(!s.latch && (s.stage%3!==1||!s.keyTaken))drawGate(828,222,108,false);else drawGate(828,222,108,true);exitDoor(s.latch||s.keyTaken);}
  const visible=Array.isArray(s.players)?s.players:[];
  for(const p of visible){
    if(String(p.id)===String(myId))continue;
    try{kiwi(p,t);}catch(err){console.warn('player draw',err);}
  }
  const own=visible.find(p=>String(p.id)===String(myId));
  // Local avatar is rendered after the scene, even when an earlier draw operation fails.

  if(!own&&!localVisual){
    kiwi({id:myId,x:142,y:247,name:playerName||'KIWI',color:'#d4b488'},t);
  }
  if(visible.length<2&&s.stage<30){roundRect(275,459,410,29,11,'#3c5e48d9');text('2인 협동 구간',480,473,14,'#f8ffe9');}
  }catch(err){
    console.error('scene render',err);
  }finally{
    const own=(state?.players||[]).find(p=>String(p.id)===String(myId));
    const pos=localVisual||own||{x:142,y:247};
    ctx.save();
    try{kiwi({id:myId,x:pos.x,y:pos.y,name:playerName||own?.name||'KIWI',color:own?.color||'#d4b488'},t);}catch(e){console.error('avatar',e);}
    ctx.restore();
  }
}
requestAnimationFrame(drawScene);
})();
</script>
